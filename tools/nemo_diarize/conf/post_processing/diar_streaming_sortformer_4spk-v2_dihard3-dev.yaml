# Sortformer streaming diarizer post-processing, optimized on the DIHARD3 dev
# split. Source: NVIDIA-NeMo examples/speaker_tasks/diarization/conf/
# post_processing/. ASCII-cleaned (NeMo reads this with the platform codec).
parameters:
  onset: 0.56            # onset threshold for the start of a speech segment
  offset: 1.0            # offset threshold for the end of a speech segment
  pad_onset: 0.063       # seconds added before each speech segment
  pad_offset: 0.002      # seconds added after each speech segment
  min_duration_on: 0.007  # drop speech segments shorter than this
  min_duration_off: 0.151 # drop silences shorter than this (merges neighbours)
